name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android platform
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Require Android production secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
          echo "Firebase Android configuration restored."

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/steal_questions_release.jks
          test -s android/app/steal_questions_release.jks
          echo "Release keystore restored."

      - name: Configure Android package Firebase and release signing
        env:
          ANDROID_RELEASE_STORE_FILE: steal_questions_release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/configure_generated_android.py

      - name: Verify generated Android entrypoint
        run: |
          grep -R -q "^package com.STEALTHE.QUESTIONSSX1$" android/app/src/main/kotlin
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Verify release signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          CERTS="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$CERTS"
          NORMALIZED="$(echo "$CERTS" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          echo "$NORMALIZED" | grep -q "c4161ee38919ce66296ca24bc7c15023253ccf63"
          echo "$NORMALIZED" | grep -q "dc176bcf9eff53f0a1b9d9effbf6c125c56345751960f9e8135fa49b63486dd8"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: steal-the-questions-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  validate-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase_functions
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase_functions/package.json

      - name: Install functions dependencies
        run: npm install

      - name: Validate server code
        run: npm run lint
